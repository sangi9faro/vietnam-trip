<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>越南跨年攻略</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌴</text></svg>">
<meta name="description" content="12/29–1/3 胡志明 → 芽庄 → 金兰湾 跨年行程">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ═══════════════════════════════════════════
   Design System — edit :root to change theme
   ═══════════════════════════════════════════ */
:root {
  --bg-primary:    #ffffff;
  --bg-secondary:  #f5f5f7;
  --bg-tertiary:   #fbfbfd;
  --bg-grouped:    #f2f2f7;
  --bg-elevated:   #ffffff;
  --text-primary:   #1d1d1f;
  --text-secondary: #86868b;
  --text-tertiary:  #aeaeb2;
  --accent:        #0071e3;
  --accent-hover:  #0077ed;
  --tint-red:    #ff3b30;
  --tint-orange: #ff9500;
  --tint-green:  #34c759;
  --tint-blue:   #007aff;
  --tint-purple: #af52de;
  --tint-pink:   #ff2d55;
  --separator:  rgba(60, 60, 67, .12);
  --shadow-sm:  0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md:  0 4px 14px rgba(0,0,0,.08);
  --shadow-lg:  0 8px 30px rgba(0,0,0,.12);
  --radius-sm:  8px;
  --radius-md:  12px;
  --radius-lg:  16px;
  --radius-xl:  20px;
  --safe-top:    env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
               "Helvetica Neue", "Arial", sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  line-height: 1.47059;
  letter-spacing: -0.022em;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── Map ── */
#map { width: 100%; height: 40vh; min-height: 280px; position: sticky; top: 0; z-index: 100; }
.locate-btn {
  width: 36px; height: 36px; border-radius: 8px;
  background: rgba(255,255,255,.92); backdrop-filter: blur(8px);
  border: none; box-shadow: 0 1px 4px rgba(0,0,0,.18);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.locate-btn.active { color: #007aff; }
@keyframes loc-pulse {
  0%   { transform: scale(1); opacity: .55; }
  100% { transform: scale(2.4); opacity: 0; }
}
.loc-pulse {
  width: 14px; height: 14px; border-radius: 50%;
  background: rgba(0,122,255,.25);
  animation: loc-pulse 1.6s ease-out infinite;
}

/* ── Tabs ── */
.tabs {
  display: flex; gap: 6px; padding: 12px 16px; overflow-x: auto; -webkit-overflow-scrolling: touch;
  background: rgba(255,255,255,.85); -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px); position: sticky; top: 40vh; z-index: 99;
  border-bottom: .5px solid var(--separator); scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0; padding: 7px 16px; border-radius: 980px; border: none;
  background: var(--bg-grouped); color: var(--text-secondary);
  font-size: 14px; font-weight: 500; cursor: pointer; transition: all .25s ease;
  white-space: nowrap; letter-spacing: -0.01em;
}
.tab:active { transform: scale(.96); }
.tab.active { background: var(--accent); color: #fff; }

/* ── Main content ── */
.content { max-width: 680px; margin: 0 auto; padding: 16px 16px calc(24px + var(--safe-bottom)); }

/* ── Overview ── */
.hero { text-align: center; padding: 28px 20px 20px; }
.hero h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; }
.hero .subtitle { font-size: 17px; color: var(--text-secondary); margin-top: 6px; font-weight: 400; }

.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.info-card { background: var(--bg-elevated); border-radius: var(--radius-lg); padding: 16px; box-shadow: var(--shadow-sm); }
.info-card .label { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .02em; margin-bottom: 6px; }
.info-card .value { font-size: 15px; font-weight: 600; line-height: 1.4; }

/* ── Section headers ── */
.section-head { font-size: 13px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .03em; padding: 20px 0 8px; }

/* ── Day header ── */
.day-head { padding: 20px 0 12px; }
.day-head h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.day-head p { font-size: 15px; color: var(--text-secondary); margin-top: 2px; }

/* ── Route bar ── */
.route-bar { background: var(--bg-elevated); border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 14px; box-shadow: var(--shadow-sm); font-size: 13px; color: var(--text-secondary); line-height: 1.7; white-space: pre-line; }
.route-bar strong { color: var(--text-primary); }

/* ── Timeline ── */
.timeline { position: relative; padding-left: 24px; }
.timeline::before { content: ''; position: absolute; left: 7px; top: 20px; bottom: 20px; width: 1.5px; background: var(--separator); }
.tl-item { position: relative; margin-bottom: 10px; }
.tl-dot { position: absolute; left: -20px; top: 18px; width: 10px; height: 10px; border-radius: 50%; z-index: 1; box-shadow: 0 0 0 3px var(--bg-secondary); }
.tl-dot.food    { background: var(--tint-red); }
.tl-dot.spot    { background: var(--tint-blue); }
.tl-dot.hotel   { background: var(--tint-orange); }
.tl-dot.drink   { background: var(--tint-purple); }
.tl-dot.transport { background: var(--text-tertiary); }

/* ── Card ── */
.card { background: var(--bg-elevated); border-radius: var(--radius-md); padding: 14px 16px; box-shadow: var(--shadow-sm); transition: box-shadow .25s ease; cursor: pointer; }
.card:active { box-shadow: var(--shadow-md); }
.card .time { font-size: 12px; font-weight: 600; color: var(--text-tertiary); letter-spacing: .01em; }
.card .name { font-size: 17px; font-weight: 600; margin: 2px 0 4px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 6px; }
.card .desc { font-size: 14px; color: var(--text-secondary); line-height: 1.45; }

/* Badge */
.badge { display: inline-flex; align-items: center; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 4px; }
.badge.food   { background: rgba(255,59,48,.1);  color: var(--tint-red); }
.badge.spot   { background: rgba(0,122,255,.1);  color: var(--tint-blue); }
.badge.drink  { background: rgba(175,82,222,.1); color: var(--tint-purple); }

/* Budget */
.budget { display: inline-block; margin-top: 6px; padding: 3px 10px; background: var(--bg-grouped); border-radius: var(--radius-sm); font-size: 12px; color: var(--text-secondary); font-weight: 500; }

/* Payment */
.pays { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.pay { font-size: 11px; padding: 2px 7px; border-radius: 4px; font-weight: 600; }
.pay.ok  { background: rgba(52,199,89,.1);  color: var(--tint-green); }
.pay.no  { background: rgba(255,59,48,.08); color: var(--tint-red); }
.pay.idk { background: rgba(255,149,0,.1);  color: var(--tint-orange); }

/* Links row */
.links { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 8px 14px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 600; border: none; cursor: pointer;
  text-decoration: none !important; transition: filter .2s;
}
.btn:active { filter: brightness(.9); }
.btn.nav    { background: var(--accent); color: #fff; }
.btn.xhs    { background: #ff2442; color: #fff; }
.btn.dp     { background: #ffa700; color: #fff; }
.btn.rsv    { background: var(--tint-green); color: #fff; }

/* Action Sheet */
.as-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(0,0,0,.35); backdrop-filter: blur(2px);
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .25s;
}
.as-overlay.show { opacity: 1; pointer-events: auto; }
.as-sheet {
  width: 100%; max-width: 420px;
  padding: 0 8px 34px;
  transform: translateY(100%); transition: transform .3s cubic-bezier(.22,1,.36,1);
}
.as-overlay.show .as-sheet { transform: translateY(0); }
.as-group {
  background: rgba(255,255,255,.88); backdrop-filter: blur(20px);
  border-radius: 14px; overflow: hidden; margin-bottom: 8px;
}
.as-group .as-item {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 16px; font-size: 18px; color: #007aff; font-weight: 500;
  border: none; background: none; width: 100%; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.as-group .as-item + .as-item { border-top: .5px solid rgba(0,0,0,.12); }
.as-group .as-item:active { background: rgba(0,0,0,.06); }
.as-cancel { font-weight: 600; }

/* Details — default open */
.details {
  margin-top: 10px; padding-top: 10px;
  border-top: .5px solid var(--separator);
  font-size: 13px; color: var(--text-secondary); line-height: 1.6;
}
.details.closed { display: none; }

/* ── Overview day list ── */
.day-list .card { margin-bottom: 8px; }
.day-list .card .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

/* ── Payment summary ── */
.pay-summary { background: var(--bg-elevated); border-radius: var(--radius-md); padding: 14px 16px; box-shadow: var(--shadow-sm); font-size: 13px; line-height: 1.7; margin-bottom: 10px; }
.pay-summary h4 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.pay-summary .warn { color: var(--tint-red); }
.pay-summary .ok-text { color: var(--tint-green); }

/* ── Legend ── */
.legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 0; font-size: 12px; color: var(--text-secondary); }
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }

/* ── Leaflet overrides ── */
.leaflet-popup-content-wrapper { border-radius: var(--radius-md) !important; box-shadow: var(--shadow-lg) !important; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif !important; }
.leaflet-popup-content { font-size: 14px !important; line-height: 1.5 !important; margin: 12px 14px !important; }
.leaflet-popup-content a { color: var(--accent) !important; }
.leaflet-popup-tip { background: #fff !important; }
.leaflet-control-zoom a { width: 34px !important; height: 34px !important; line-height: 34px !important; font-size: 16px !important; border-radius: 10px !important; background: rgba(255,255,255,.85) !important; -webkit-backdrop-filter: blur(10px) !important; backdrop-filter: blur(10px) !important; border: .5px solid var(--separator) !important; color: var(--text-primary) !important; }
.leaflet-control-zoom { border-radius: 12px !important; overflow: hidden; box-shadow: var(--shadow-md) !important; border: none !important; }
.leaflet-control-attribution { font-size: 9px !important; opacity: .5; }
.dest-switch{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.dest-switch .tab{text-decoration:none}
.card.warn{border-left:4px solid var(--tint-orange)}
.note{text-align:center;font-size:13px;color:var(--text-secondary);margin-bottom:16px}

/* ── sync status, distance rows, edit mode ── */
#syncStatus{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:1200;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#6e6e73;font-size:12px;font-weight:600;border-radius:980px;padding:4px 10px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
#syncStatus.ok{color:#248a3d}
.leg{font-size:12px;color:var(--text-secondary);margin:-2px 0 8px 2px;padding-left:2px;font-variant-numeric:tabular-nums}
.dh-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dh-who{color:var(--text-tertiary)}
.ed-toggle{flex-shrink:0;border:0;border-radius:980px;padding:6px 14px;font-size:14px;font-weight:600;background:var(--bg-grouped);color:var(--accent);cursor:pointer}
.edit-bar{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:10px;border-top:.5px solid var(--separator)}
.edit-bar button,.edit-bar select{border:1px solid var(--separator);background:var(--bg-secondary);color:var(--text-primary);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;max-width:100%}
.edit-bar .danger{color:var(--tint-red)}
.edit-bar .armed{background:var(--tint-red);color:#fff;border-color:var(--tint-red)}
.add-loc{width:100%;margin:6px 0 20px;border:1.5px dashed var(--separator);background:none;border-radius:var(--radius-md);padding:12px;font-size:15px;font-weight:600;color:var(--accent);cursor:pointer}
.edit-form{display:grid;gap:10px;cursor:default;margin-bottom:10px;border:1.5px solid var(--accent)}
.edit-form .ef-title{font-weight:700}
.edit-form label{display:grid;gap:4px;font-size:12.5px;color:var(--text-secondary);min-width:0}
.edit-form input,.edit-form select,.edit-form textarea{font:inherit;font-size:15px;color:var(--text-primary);background:var(--bg-secondary);border:1px solid var(--separator);border-radius:8px;padding:8px 10px;width:100%;min-width:0;box-sizing:border-box}
.edit-form .ef-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.ef-coord{font-size:13px;color:var(--text-secondary)}
.ef-actions{display:flex;justify-content:flex-end;gap:8px}
.btn-primary,.btn-ghost{border:0;border-radius:980px;padding:8px 18px;font-weight:600;font-size:14px;cursor:pointer}
.btn-primary{background:var(--accent);color:#fff}.btn-ghost{background:var(--bg-grouped);color:var(--text-primary)}
.btn-primary:disabled{opacity:.5}
#gtoast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:#1d1d1f;color:#fff;padding:10px 18px;border-radius:980px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;pointer-events:none;z-index:3000;max-width:92vw;text-align:center}
#gtoast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div id="map"></div>
<div class="tabs" id="tabs"></div>
<div class="content" id="content"></div>

<script>
// ╔══════════════════════════════════════════════════════════════╗
// ║  Trip data: HCMC 12/29–12/31 → Nha Trang → Cam Ranh → HCMC  ║
// ╚══════════════════════════════════════════════════════════════╝
const HOTEL = { name: '', lat: 0, lng: 0 };
const g = q => encodeURIComponent(q);
const SGN = [10.81798, 106.65626], D1 = [10.77372, 106.70405], HCMC_HOTEL = [10.78246, 106.69186];

const DAYS = [
  { id: 0, label: '总览', color: '#0071e3', locations: [] },
  { id: 1, label: 'D1 胡志明', date: '12/29 周二 · 晚上', title: '成员A先到 · 入住', color: '#ff9500', locations: [
    { name: '新山一国际机场（SGN）', lat: SGN[0], lng: SGN[1], type: 'transport', time: '晚上', desc: '从台北飞来。出关后用 Grab 打车去酒店，第三郡约 20–30 分钟。', gmap: g('Tan Son Nhat International Airport') },
    { name: '入住：M Village 快捷酒店（南圻起义街）', lat: HCMC_HOTEL[0], lng: HCMC_HOTEL[1], type: 'hotel', time: '入住', desc: '214 Nam Ky Khoi Nghia，第三郡。工作室房，1.6 米大床，有厨房。胡志明只住这一晚。订的时候按实际人数登记，跟前台说成员C和成员D 12/30 早上会来。到第一郡景点打车约 10 分钟。', gmap: g('Express by M Village Nam Ky Khoi Nghia') },
    { name: '范五老 · 裴援步行街', lat: 10.76683, lng: 106.69267, type: 'drink', time: '—', desc: '到得早、还有精神的话，酒吧街开到凌晨。', xhsKeyword: '胡志明 裴援街', gmap: g('Bui Vien Walking Street') },
  ]},
  { id: 2, label: 'D2 胡志明', date: '12/30 周三 · 成员A、成员C、成员D', title: '市区一日游 · 酒吧等成员B', color: '#34c759', locations: [
    { name: '成员C抵达（从上海）', lat: SGN[0], lng: SGN[1], type: 'transport', time: '05:40', desc: '浦东 02:15 起飞，到新山一 T2。出关后 Grab 到酒店，跟成员A住一间，补觉到中午。', gmap: g('Tan Son Nhat International Airport') },
    { name: '成员D抵达（从深圳）', lat: SGN[0], lng: SGN[1], type: 'transport', time: '06:50', desc: '宝安 T3 05:00 起飞，到新山一 T2（待出票）。比成员C晚一个小时，可以在机场等他一起打车，或各自去酒店。', gmap: g('Tan Son Nhat International Airport') },
    { name: '中午退房 · 行李寄存前台', lat: HCMC_HOTEL[0], lng: HCMC_HOTEL[1], type: 'hotel', time: '12:00', desc: '今晚不住酒店。退房后把行李寄存在 M Village 前台，半夜去坐车前再取。', gmap: g('Express by M Village Nam Ky Khoi Nghia') },
    { name: 'Phở Hòa Pasteur 河粉', lat: 10.7868, lng: 106.68905, type: 'food', time: '12:30', desc: '老牌河粉店，当午饭。', xhsKeyword: '胡志明 Pho Hoa', gmap: g('Pho Hoa Pasteur Ho Chi Minh City') },
    { name: '西贡中央邮局 · 红教堂', lat: 10.77996, lng: 106.69999, type: 'spot', time: '14:00', desc: '法式老建筑，挨在一起。红教堂外立面可能还在修，以现场为准。', xhsKeyword: '西贡中央邮局', gmap: g('Saigon Central Post Office') },
    { name: '战争遗迹博物馆', lat: 10.77936, lng: 106.69228, type: 'spot', time: '15:00', desc: '内容沉重，约 1.5 小时。', xhsKeyword: '胡志明 战争遗迹博物馆', gmap: g('War Remnants Museum') },
    { name: '滨城市场', lat: 10.77253, lng: 106.69804, type: 'food', time: '16:45', desc: '小吃、咖啡、腰果。伴手礼也可以之后在芽庄买。', xhsKeyword: '胡志明 滨城市场', gmap: g('Ben Thanh Market') },
    { name: 'Bánh Mì Huỳnh Hoa 法棍', lat: 10.77139, lng: 106.69272, type: 'food', time: '18:00', desc: '最有名的法棍之一，料很足，当晚饭。', xhsKeyword: '胡志明 Huynh Hoa 法棍', gmap: g('Banh Mi Huynh Hoa') },
    { name: '阮惠步行街', lat: 10.77372, lng: 106.70405, type: 'spot', time: '19:30', desc: '晚上很热闹，两边咖啡楼可以上楼看街景。', xhsKeyword: '胡志明 阮惠步行街', gmap: g('Nguyen Hue Walking Street') },
    { name: 'Chill Skybar（AB Tower 楼顶）', lat: 10.77052, lng: 106.69439, type: 'drink', time: '21:00', desc: '楼顶酒吧看夜景，有着装要求，以官方为准。之后可以转去裴援街。', xhsKeyword: '胡志明 Chill Skybar', gmap: g('Chill Skybar Ho Chi Minh City') },
    { name: '裴援步行街 · 等成员B', lat: 10.76683, lng: 106.69267, type: 'drink', time: '23:00', desc: '酒吧开到凌晨。成员B 01:20 落地，00:00 左右回酒店取行李（白天先问好前台夜里能不能取），再去机场接他，或直接在大巴上车点会合。', xhsKeyword: '胡志明 裴援街', gmap: g('Bui Vien Walking Street') },
  ]},

  const r5 = m => Math.max(5, Math.round(m / 5) * 5);
  let t = `约 ${km} km · 打车约 ${r5(d / (d < 15 ? 20 : 60) * 60)} 分钟`;
  if (d < 2) t += ` · 步行约 ${r5(d / 4.5 * 60)} 分钟`;
  return t;
}
const legRow = (a, b) => { const t = legText(a, b); return t ? `<div class="leg" title="直线距离估算，仅供参考">↓ ${t}</div>` : ''; };

// ══════════ CARDS ══════════
const TYPES = [['spot', '景点'], ['food', '吃饭'], ['drink', '酒吧'], ['hotel', '住宿'], ['transport', '交通']];
let editMode = false, form = null, pendingRender = false, armedDel = null;
function locCard(loc, dayIdx) {
  if (form && form.id === loc.id) return `<div class="tl-item">${formHtml(loc)}</div>`;
  const dot = ['food', 'spot', 'drink', 'hotel'].includes(loc.type) ? loc.type : 'transport';
  const bdg = loc.type === 'food' ? '<span class="badge food">餐</span>' : loc.type === 'spot' ? '<span class="badge spot">景</span>' : loc.type === 'drink' ? '<span class="badge drink">饮</span>' : '';
  let lnk = `<button class="btn nav" data-nav="${esc(loc.id)}">📍 导航</button>`;
  if (loc.xhs || loc.xhsKeyword) {
    const xhsHref = IN_APP_WEBVIEW ? xhsWebUrl(loc) : xhsAppUrl(loc);
    lnk += `<a href="${esc(xhsHref)}" data-xhs="${esc(loc.id)}" class="btn xhs">${IN_APP_WEBVIEW ? '📕 小红书' : '📕 小红书 App'}</a>`;
  }
  if (safeUrl(loc.reserve)) lnk += `<a href="${esc(loc.reserve)}" target="_blank" rel="noopener" class="btn rsv">📅 预约</a>`;
  const day = DAYS.find(x => x.id === dayIdx);
  const bar = editMode && !form ? `<div class="edit-bar">
      <button data-ed="up" data-id="${esc(loc.id)}" aria-label="上移">↑</button><button data-ed="down" data-id="${esc(loc.id)}" aria-label="下移">↓</button>
      <select data-ed="move" data-id="${esc(loc.id)}" aria-label="移到哪一天"><option value="">移到…</option>${DAYS.slice(1).filter(d => d.id !== dayIdx).map(d => `<option value="${d.id}">${esc(d.label)}</option>`).join('')}</select>
      <button data-ed="edit" data-id="${esc(loc.id)}">改</button><button data-ed="del" data-id="${esc(loc.id)}" class="danger">删</button></div>` : '';
  return `<div class="tl-item"><div class="tl-dot ${dot}"></div><div class="card"><div class="time">${loc.time !== '—' ? esc(loc.time) : '备选'}</div><div class="name">${bdg} ${esc(loc.name)}</div><div class="desc">${esc(loc.desc)}</div>${loc.budget ? '<div class="budget">' + esc(loc.budget) + '</div>' : ''}<div class="links">${lnk}</div>${bar}</div></div>`;
}
function formHtml(loc) {
  const l = loc || {}, lat = form.lat, lng = form.lng;
  return `<div class="card edit-form" id="editForm">
    <div class="ef-title">${loc ? '修改地点' : '添加地点'}</div>
    <label>名称<input id="ef-name" maxlength="60" value="${esc(l.name)}"></label>
    <div class="ef-row"><label>时间<input id="ef-time" maxlength="20" value="${esc(l.time === '—' ? '' : l.time)}" placeholder="留空 = 备选"></label>
      <label>类型<select id="ef-type">${TYPES.map(([k, n]) => `<option value="${k}" ${(l.type || 'spot') === k ? 'selected' : ''}>${n}</option>`).join('')}</select></label></div>
    <label>说明<textarea id="ef-desc" rows="3" maxlength="300">${esc(l.desc)}</textarea></label>
    <label>小红书关键词<input id="ef-xhs" maxlength="40" value="${esc(l.xhsKeyword)}"></label>
    <label>位置<input id="ef-link" placeholder="粘贴谷歌地图链接，或在上方地图点一下"></label>
    <div class="ef-coord" id="ef-coord">${lat ? `📍 ${lat.toFixed(5)}, ${lng.toFixed(5)}` : '还没有位置'}</div>
    <div class="ef-actions"><button class="btn-ghost" data-ef="cancel">取消</button><button class="btn-primary" data-ef="save">保存</button></div></div>`;
}
function renderDay(idx) {
  const d = DAYS.find(x => x.id === idx); if (!d) return '';
  const main = d.locations.filter(l => l.time !== '—'), alt = d.locations.filter(l => l.time === '—');
  const editBtn = canEdit() ? `<button class="ed-toggle" data-ed="toggle">${editMode ? '完成' : '编辑'}</button>` : '';
  let h = `<div class="day-head"><div class="dh-row"><h2>${esc(d.title)}</h2>${editBtn}</div><p>${esc(d.date)}${d.who ? ` · <span class="dh-who">最后修改：${esc(memberName(d.who))}</span>` : ''}</p></div>`;
  if (main.length) { h += '<div class="section-head">行程</div><div class="timeline">'; main.forEach((l, i) => { if (i) h += legRow(main[i - 1], l); h += locCard(l, idx); }); h += '</div>'; }
  if (alt.length) { h += '<div class="section-head">备选</div><div class="timeline">'; alt.forEach(l => h += locCard(l, idx)); h += '</div>'; }
  if (editMode) h += form && !form.id ? formHtml(null) : (!form ? `<button class="add-loc" data-ed="add">＋ 添加地点</button>` : '');
  return h;
}

// ══════════ NAV ══════════
let cur = 0;
const tabsEl = document.getElementById('tabs');
const contentEl = document.getElementById('content');
function renderTabs() {
  tabsEl.innerHTML = DAYS.map(d => `<button class="tab${d.id === cur ? ' active' : ''}" data-day="${d.id}">${esc(d.label)}</button>`).join('');
}
renderTabs();
function rerender() { contentEl.innerHTML = cur === 0 ? overviewContent() : renderDay(cur); showDay(cur); }
function go(idx) {
  if (form) closeForm(false);
  if (idx !== cur) editMode = false;
  cur = idx;
  tabsEl.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', +t.dataset.day === idx));
  rerender();
  window.scrollTo({ top: 0 });
  const tab = tabsEl.querySelector(`[data-day="${idx}"]`);
  if (tab) tab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}
tabsEl.addEventListener('click', e => { const t = e.target.closest('.tab'); if (t) go(+t.dataset.day); });

// card interactions (no inline handlers: names are user-entered)
contentEl.addEventListener('click', e => {
  const n = e.target.closest('[data-nav]'); if (n) { const l = findLoc(n.dataset.nav); if (l) openAS(l.name, l.lat, l.lng, l.gmap); return; }
  const x = e.target.closest('[data-xhs]'); if (x) { const l = findLoc(x.dataset.xhs); if (l) { e.preventDefault(); window.location.href = IN_APP_WEBVIEW ? xhsWebUrl(l) : xhsAppUrl(l); } return; }
});

// ══════════ SYNC STATUS + FIREBASE ══════════
const statusEl = document.createElement('div'); statusEl.id = 'syncStatus'; statusEl.textContent = '正在连接…'; document.body.appendChild(statusEl);
const setStatus = (t, ok) => { statusEl.textContent = t; statusEl.classList.toggle('ok', !!ok); };
let db = null, uid = null, synced = false, me = '', members = { m1: '杨巧思', m2: '钟知心', m3: '陈性情', m4: '王大气' };
try { me = localStorage.getItem('trip-me') || ''; } catch (e) {}
const memberName = id => members[id] || '';
const canEdit = () => !!(db && uid && synced);
let toastTimer = 0;
function toast(m) { let t = document.getElementById('gtoast'); if (!t) { t = document.createElement('div'); t.id = 'gtoast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600); }

function applyDays(docs) {
  docs.forEach(doc => { const n = +doc.id.slice(1); if (!(n >= 1 && n <= 6)) return; const v = doc.data();
    const i = DAYS.findIndex(d => d.id === n); const day = { id: n, label: v.label, date: v.date, title: v.title, color: v.color, locations: v.locations || [], rev: v.rev, who: v.who || '' };
    if (i >= 0) DAYS[i] = day; else DAYS.push(day); });
  DAYS.sort((a, b) => a.id - b.id);
  if (form) { pendingRender = true; return; }   // never wipe a form someone is typing in
  renderTabs(); rerender();
}
async function seedDays() {
  // Only called after the server confirmed the collection is incomplete; transactions skip existing docs
  for (const d of DAYS.slice(1)) {
    const ref = db.doc('days/d' + d.id);
    try { await db.runTransaction(async tx => { const s = await tx.get(ref); if (s.exists) return;
      tx.set(ref, { label: d.label, date: d.date, title: d.title, color: d.color, locations: d.locations.map(cleanLoc), rev: 1, who: '', by: uid, at: Date.now() }); }); } catch (e) {}
  }
}
function loadScript(src) { return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.async = false; el.onload = res; el.onerror = () => rej(new Error(src)); document.head.appendChild(el); }); }
(async function start() {
  const OFF = '离线，只能查看';
  let connected = false, subscribed = false;
  const fail = () => { if (!synced) setStatus(OFF); };
  const timer = setTimeout(() => { if (!connected) fail(); }, 10000);
  const SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
  try { for (const s of [SDK + 'firebase-app-compat.js', SDK + 'firebase-auth-compat.js', SDK + 'firebase-firestore-compat.js', 'firebase-config.js']) await loadScript(s); }
  catch (e) { clearTimeout(timer); fail(); return; }
  try { firebase.initializeApp(window.FIREBASE_CONFIG); } catch (e) { clearTimeout(timer); fail(); return; }
  firebase.auth().onAuthStateChanged(u => {
    if (!u || subscribed) return;
    subscribed = true; uid = u.uid; db = firebase.firestore();
    db.collection('days').onSnapshot({ includeMetadataChanges: false }, snap => {
      if (snap.metadata.fromCache) return;
      if (!connected) { connected = true; clearTimeout(timer); }
      if (snap.size < 6) { seedDays(); if (snap.empty) return; }
      synced = true; setStatus('行程已同步', true);
      applyDays(snap.docs);
    }, () => { synced = false; setStatus(OFF); if (!form) rerender(); });
    db.doc('meta/settings').onSnapshot(d => { if (d.exists && d.data().members) { members = { ...members, ...d.data().members }; if (!form && cur) rerender(); } }, () => {});
  });
  firebase.auth().signInAnonymously().catch(() => { clearTimeout(timer); fail(); });
})();

// ══════════ EDITING ══════════
const dayDoc = n => db.doc('days/d' + n);
// Transaction guarded by rev: abort if anyone saved this day since we last saw it
async function commit(changes) {   // changes: [{ n, rev, locations }]
  try {
    await db.runTransaction(async tx => {
      const snaps = await Promise.all(changes.map(c => tx.get(dayDoc(c.n))));
      snaps.forEach((s, i) => { if (!s.exists || s.data().rev !== changes[i].rev) throw new Error('conflict'); });
      changes.forEach((c, i) => tx.update(dayDoc(c.n), { locations: c.locations.map(cleanLoc), rev: snaps[i].data().rev + 1, who: IDS_OK(me), by: uid, at: Date.now() }));
    });
    return true;
  } catch (e) {
    toast(e && e.message === 'conflict' ? '别人刚改了这一天，已刷新，请重新操作' : '保存失败，请稍后再试');
    return false;
  }
}
const IDS_OK = m => ['m1', 'm2', 'm3', 'm4'].includes(m) ? m : '';
const dayOf = n => DAYS.find(d => d.id === n);
const isAlt = l => l.time === '—';

contentEl.addEventListener('click', async e => {
  const b = e.target.closest('[data-ed]'); if (!b || b.tagName === 'SELECT') return;
  const act = b.dataset.ed, d = dayOf(cur);
  if (act === 'toggle') { if (form) closeForm(false); editMode = !editMode; rerender(); return; }
  if (act === 'add') { openForm(null); return; }
  const id = b.dataset.id, locs = d.locations.slice(), i = locs.findIndex(l => l.id === id); if (i < 0) return;
  if (act === 'edit') { openForm(locs[i]); return; }
  if (act === 'up' || act === 'down') {
    // swap with the neighbour in the same group (main timeline or 备选)
    const step = act === 'up' ? -1 : 1; let j = i + step;
    while (j >= 0 && j < locs.length && isAlt(locs[j]) !== isAlt(locs[i])) j += step;
    if (j < 0 || j >= locs.length) return;
    [locs[i], locs[j]] = [locs[j], locs[i]];
    await commit([{ n: cur, rev: d.rev, locations: locs }]); return;
  }
  if (act === 'del') {
    if (armedDel !== b.dataset.id) { armedDel = b.dataset.id; b.textContent = '确认删除？'; b.classList.add('armed');
      setTimeout(() => { if (armedDel === id) { armedDel = null; b.textContent = '删'; b.classList.remove('armed'); } }, 3000); return; }
    armedDel = null; locs.splice(i, 1);
    if (await commit([{ n: cur, rev: d.rev, locations: locs }])) toast('已删除'); return;
  }
});
contentEl.addEventListener('change', async e => {
  const s = e.target.closest('select[data-ed="move"]'); if (!s || !s.value) return;
  const to = +s.value, from = dayOf(cur), dest = dayOf(to), locs = from.locations.slice(), i = locs.findIndex(l => l.id === s.dataset.id); if (i < 0) return;
  const [moved] = locs.splice(i, 1);
  if (await commit([{ n: cur, rev: from.rev, locations: locs }, { n: to, rev: dest.rev, locations: [...dest.locations, moved] }])) toast('已移到 ' + dest.label);
  else s.value = '';
});

// ── form: inline, survives remote updates; location from map click or a pasted Google Maps link ──
let tempMarker = null;
function openForm(loc) {
  const d = dayOf(cur);
  form = { id: loc ? loc.id : null, rev: d.rev, lat: loc ? loc.lat : null, lng: loc ? loc.lng : null, origName: loc ? loc.name : '', origGmap: loc ? loc.gmap : '' };
  rerender();
  if (form.lat) setTemp(form.lat, form.lng);
  const f = document.getElementById('editForm'); if (f) { f.scrollIntoView({ block: 'center', behavior: 'smooth' }); document.getElementById('ef-name').focus({ preventScroll: true }); }
}
function closeForm(render = true) {
  form = null; if (tempMarker) { map.removeLayer(tempMarker); tempMarker = null; }
  if (render) { if (pendingRender) { pendingRender = false; renderTabs(); } rerender(); } else pendingRender = false;
}
function setTemp(lat, lng) {
  if (tempMarker) tempMarker.setLatLng([lat, lng]);
  else tempMarker = L.marker([lat, lng], { icon: icon('#ff3b30', '📌'), zIndexOffset: 3000 }).addTo(map);
}
function setFormLoc(lat, lng) {
  form.lat = +(+lat).toFixed(6); form.lng = +(+lng).toFixed(6); setTemp(form.lat, form.lng);
  const c = document.getElementById('ef-coord'); if (c) c.textContent = `📍 ${form.lat.toFixed(5)}, ${form.lng.toFixed(5)}`;
}
map.on('click', e => { if (form) setFormLoc(e.latlng.lat, e.latlng.lng); });
function parseGmaps(u) {
  if (/maps\.app\.goo\.gl|goo\.gl\/maps/i.test(u)) return 'short';
  const pats = [/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/, /[?&](?:q|query)=(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/, /[?&]ll=(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/, /@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/];
  for (const p of pats) { const m = decodeURIComponent(u).match(p); if (m && Math.abs(+m[1]) <= 90 && Math.abs(+m[2]) <= 180) return [+m[1], +m[2]]; }
  return null;
}
contentEl.addEventListener('input', e => {
  if (e.target.id !== 'ef-link' || !form) return;
  const v = e.target.value.trim(); if (!v) return;
  const r = parseGmaps(v), c = document.getElementById('ef-coord');
  if (r === 'short') c.textContent = '这是短链接，网页读不出坐标。请在浏览器打开后，复制地址栏的完整链接。';
  else if (r) { setFormLoc(r[0], r[1]); map.setView([r[0], r[1]], 15); }
  else c.textContent = '没识别出坐标，换完整的谷歌地图链接，或者直接在地图上点一下。';
});
contentEl.addEventListener('click', async e => {
  const b = e.target.closest('[data-ef]'); if (!b || !form) return;
  if (b.dataset.ef === 'cancel') { closeForm(); return; }
  const name = document.getElementById('ef-name').value.trim();
  if (!name) return toast('先填名称');
  if (!form.lat) return toast('先在地图上点一下，或粘贴谷歌地图链接');
  const time = document.getElementById('ef-time').value.trim() || '—';
  const d = dayOf(cur), locs = d.locations.slice();
  const defGmap = n => encodeURIComponent(n + ' Vietnam');
  const old = form.id ? locs.find(l => l.id === form.id) : null;
  const gmap = old && old.gmap && old.gmap !== defGmap(form.origName) ? old.gmap : defGmap(name);
  const loc = { ...(old || {}), id: form.id || rid(), name, time, type: document.getElementById('ef-type').value, desc: document.getElementById('ef-desc').value.trim(),
    xhsKeyword: document.getElementById('ef-xhs').value.trim(), lat: form.lat, lng: form.lng, gmap };
  if (old) locs[locs.indexOf(old)] = loc; else locs.push(loc);
  b.disabled = true;
  const ok = await commit([{ n: cur, rev: form.rev, locations: locs }]);
  b.disabled = false;
  if (ok) { toast(old ? '已保存' : '已添加'); closeForm(); }
  else { closeForm(); }   // conflict: data already refreshed by the listener
});


/* ── Action Sheet for Navigation ── */
const asOverlay = document.createElement('div');
asOverlay.className = 'as-overlay';
asOverlay.innerHTML = `<div class="as-sheet">
  <div class="as-group" id="as-opts"></div>
  <div class="as-group"><button class="as-item as-cancel" onclick="closeAS()">取消</button></div>
</div>`;
document.body.appendChild(asOverlay);
asOverlay.addEventListener('click', e => { if (e.target === asOverlay) closeAS(); });

const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
function amapAppUrl(name, lat, lng) {
  const scheme = IS_IOS ? 'iosamap' : 'androidamap';
  return `${scheme}://viewMap?sourceApplication=trip&poiname=${encodeURIComponent(name)}&lat=${lat}&lon=${lng}&dev=0`;
}
function amapWebUrl(name, lat, lng) {
  return `https://uri.amap.com/marker?position=${lng},${lat}&name=${encodeURIComponent(name)}&src=trip&coordinate=wgs84&callnative=1`;
}
function openAmap(name, lat, lng) {
  if (IN_APP_WEBVIEW) { window.open(amapWebUrl(name, lat, lng)); return; }
  window.location.href = amapAppUrl(name, lat, lng);
}

function openAS(name, lat, lng, gmap) {
  const q = gmap || encodeURIComponent(name + ' Vietnam'), encName = encodeURIComponent(name);
  // WebView 内 maps:// 通常被拦截，改用 https Apple Maps URL —— iOS 系统会自动拉起 Apple Maps
  const appleUrl = IN_APP_WEBVIEW ? `https://maps.apple.com/?q=${+lat},${+lng}&ll=${+lat},${+lng}&name=${encName}` : `maps://maps.apple.com/?q=${+lat},${+lng}&name=${encName}`;
  const googleUrl = `https://www.google.com/maps/search/?api=1&query=${q}`;
  const box = document.getElementById('as-opts'); box.innerHTML = '';
  [['🍎 Apple Maps', () => window.open(appleUrl)], ['🗺️ Google Maps', () => window.open(googleUrl)], ['🧭 高德地图 App', () => openAmap(name, +lat, +lng)]].forEach(([t, f]) => {
    const b = document.createElement('button'); b.className = 'as-item'; b.textContent = t; b.addEventListener('click', () => { f(); closeAS(); }); box.appendChild(b);
  });
  asOverlay.classList.add('show');
}
function closeAS() { asOverlay.classList.remove('show'); }

go(0);
</script>
