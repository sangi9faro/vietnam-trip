<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>投票合集 · 越南跨年</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗳️</text></svg>">
<style>
/* Same fresh light theme as the toolbox */
:root{
  --bg:#f5f5f7; --surface:#fff; --ink:#1d1d1f; --muted:#6e6e73; --line:rgba(60,60,67,.12);
  --sea:#0071e3; --sea-soft:#e8f2fd; --orange:#ff9500; --green:#248a3d; --green-soft:#e6f5ea; --red:#d70015;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--surface:#1c1c1e;--ink:#f5f5f7;--muted:#98989d;--line:rgba(84,84,88,.55);--sea:#0a84ff;--sea-soft:#0d2a4a;--green:#30d158;--green-soft:#10301a;--red:#ff453a;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--surface:#1c1c1e;--ink:#f5f5f7;--muted:#98989d;--line:rgba(84,84,88,.55);--sea:#0a84ff;--sea-soft:#0d2a4a;--green:#30d158;--green-soft:#10301a;--red:#ff453a;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);letter-spacing:-0.01em;-webkit-font-smoothing:antialiased}
a{color:var(--sea);text-decoration:none}
button,input,select{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.top-in b{color:var(--ink);font-size:16px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 64px;display:grid;gap:14px}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:16px;display:grid;gap:10px}
.card h2{margin:0;font-size:18px;line-height:1.35}
.sub{margin:0;color:var(--muted);font-size:13px}
.status{font-size:13px;color:var(--muted);text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:980px;padding:9px 18px;font-weight:600;background:var(--sea);color:#fff;cursor:pointer}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:5px 12px;font-size:13px}
.btn.danger{background:none;color:var(--red);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
input[type=text],select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;width:100%}
input:focus-visible,select:focus-visible,.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.seg{display:inline-flex;background:var(--bg);border-radius:980px;padding:3px}
.seg button{border:0;background:none;border-radius:980px;padding:5px 14px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.optrow{display:flex;gap:6px}
.optrow button{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 6px}
.meta{font-size:12.5px;color:var(--muted)}
.tag{display:inline-block;border-radius:980px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--sea-soft);color:var(--sea);margin-right:6px}
.tag.closed{background:var(--bg);color:var(--muted)}
/* option = button with a result bar behind it */
.opt{position:relative;overflow:hidden;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 12px;cursor:pointer}
.opt:disabled{cursor:default}
.opt .bar{position:absolute;inset:0 auto 0 0;background:var(--sea-soft);transition:width .4s;z-index:0}
.opt>*:not(.bar){position:relative;z-index:1}
.opt .mark{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:#fff}
.opt.multi .mark{border-radius:6px}
.opt.mine{border-color:var(--sea)}
.opt.mine .mark{background:var(--sea);border-color:var(--sea)}
.opt.lead .bar{background:color-mix(in srgb,var(--green) 22%,transparent)}
.opt .lbl{font-weight:600;word-break:break-word}
.opt .who{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.opt .n{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.legacy{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:10px 0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:980px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;pointer-events:none;z-index:30;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in"><b>🗳️ 投票合集</b><span><a href="./">工具箱</a> · <a href="guide.html">攻略</a></span></div></header>
<div id="toast" role="status" aria-live="polite"></div>

<main class="wrap">
  <div class="status" id="who">正在连接数据…</div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <h2>我是谁</h2>
      <select id="meSel" aria-label="我是谁" style="width:auto"></select>
    </div>
    <p class="sub">选好才能投票和发起投票。跟工具箱共用，选一次就记住。</p>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between"><h2>发起投票</h2><button class="btn small" id="newBtn" aria-expanded="false">＋ 新投票</button></div>
    <form id="newForm" class="card" style="box-shadow:none;padding:0" hidden>
      <input type="text" id="pTitle" maxlength="80" placeholder="问题，例如：12/30 晚上去哪个酒吧？" aria-label="投票问题">
      <div id="pOpts" style="display:grid;gap:8px"></div>
      <div class="row" style="justify-content:space-between">
        <button type="button" class="btn ghost small" id="addOpt">＋ 加一个选项</button>
        <div class="seg" role="group" aria-label="单选或多选"><button type="button" data-multi="0" class="on">单选</button><button type="button" data-multi="1">多选</button></div>
      </div>
      <button class="btn" id="pCreate" type="submit">发起</button>
    </form>
  </div>

  <div class="seg" role="tablist" style="justify-self:center"><button data-show="open" class="on">进行中</button><button data-show="closed">已截止</button><button data-show="all">全部</button></div>
  <div id="polls" style="display:grid;gap:14px"></div>

</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const IDS = ["m1", "m2", "m3", "m4"];
let members = { m1: "杨巧思", m2: "钟知心", m3: "陈性情", m4: "王大气" };
let db = null, uid = null, me = "", polls = [], ballots = {}, show = "open", multi = false;
// The first poll (where to go) lives in the old votes/people collections; shown read-only as a closed poll
let legacyVotes = [], legacyPeople = {};
const DEST = [["pq", "富国岛"], ["nt", "芽庄"], ["dn", "岘港"]];
try { me = localStorage.getItem("trip-me") || ""; } catch (e) {}
const nm = id => members[id] || id;
const ready = () => !!(db && uid);
let toastTimer = 0;
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2000); }

/* ---------- identity ---------- */
function renderMe() {
  $("#meSel").innerHTML = `<option value="">— 选一下 —</option>` + IDS.map(id => `<option value="${id}" ${id === me ? "selected" : ""}>${esc(nm(id))}</option>`).join("");
}
$("#meSel").addEventListener("change", e => { me = e.target.value; try { localStorage.setItem("trip-me", me); } catch (er) {} renderPolls(); });

/* ---------- create ---------- */
function optInput(v = "") { const d = document.createElement("div"); d.className = "optrow";
  d.innerHTML = `<input type="text" maxlength="40" placeholder="选项" value="${esc(v)}" aria-label="选项"><button type="button" aria-label="删除这个选项">×</button>`; return d; }
function resetForm() { $("#pTitle").value = ""; $("#pOpts").innerHTML = ""; $("#pOpts").append(optInput(), optInput()); multi = false; renderSeg(); }
function renderSeg() { document.querySelectorAll("[data-multi]").forEach(b => b.classList.toggle("on", (b.dataset.multi === "1") === multi)); }
$("#newBtn").addEventListener("click", () => { const f = $("#newForm"); f.hidden = !f.hidden; $("#newBtn").setAttribute("aria-expanded", String(!f.hidden)); if (!f.hidden && !$("#pOpts").children.length) resetForm(); if (!f.hidden) $("#pTitle").focus(); });
$("#addOpt").addEventListener("click", () => { if ($("#pOpts").children.length >= 8) return toast("最多 8 个选项"); const r = optInput(); $("#pOpts").append(r); r.querySelector("input").focus(); });
$("#pOpts").addEventListener("click", e => { if (e.target.tagName === "BUTTON" && $("#pOpts").children.length > 2) e.target.parentElement.remove(); });
document.querySelectorAll("[data-multi]").forEach(b => b.addEventListener("click", () => { multi = b.dataset.multi === "1"; renderSeg(); }));
$("#newForm").addEventListener("submit", async e => {
  e.preventDefault();
  if (!ready()) return toast("还没连上数据库");
  if (!me) return toast("先在上面选一下你是谁");
  const title = $("#pTitle").value.trim();
  const options = [...$("#pOpts").querySelectorAll("input")].map(i => i.value.trim()).filter(Boolean).map(o => o.slice(0, 40));
  if (!title) return toast("先写问题");
  if (options.length < 2) return toast("至少两个选项");
  if (new Set(options).size !== options.length) return toast("选项不能重复");
  $("#pCreate").disabled = true;
  try {
    await db.collection("polls").add({ title: title.slice(0, 80), options, multi, closed: false, who: me, by: uid, at: Date.now() });
    resetForm(); $("#newForm").hidden = true; $("#newBtn").setAttribute("aria-expanded", "false"); show = "open"; renderTabs(); toast("已发起");
  } catch (err) { toast("发起失败，请稍后再试"); }
  $("#pCreate").disabled = false;
});

/* ---------- list + vote ---------- */
function renderTabs() { document.querySelectorAll("[data-show]").forEach(b => b.classList.toggle("on", b.dataset.show === show)); renderPolls(); }
document.querySelectorAll("[data-show]").forEach(b => b.addEventListener("click", () => { show = b.dataset.show; renderTabs(); }));
function legacyCard() {
  const byName = new Map();  // one vote per name (someone voting from two phones counts once)
  legacyVotes.forEach(v => { const n = legacyPeople[v.id]; if (n && DEST.some(d => d[0] === v.choice)) byName.set(n, v.choice); });
  const total = byName.size, counts = DEST.map(([k]) => [...byName].filter(([, c]) => c === k).map(([n]) => n)), max = Math.max(0, ...counts.map(c => c.length));
  return `<article class="card"><div><span class="tag closed">已截止</span><span class="meta">单选 · 第一个投票</span></div>
    <h2>越南去哪儿？</h2>
    <div style="display:grid;gap:8px">${DEST.map(([k, l], i) => { const c = counts[i], pct = total ? Math.round(c.length * 100 / total) : 0;
      return `<div class="opt ${c.length && c.length === max ? "lead" : ""}" style="cursor:default"><span class="bar" style="width:${pct}%"></span><span class="mark"></span>
        <span class="lbl">${l}<span class="who">${c.map(esc).join("、")}</span></span><span class="n">${c.length} 票 · ${pct}%</span></div>`; }).join("")}</div>
    <div class="meta">${total} 人投票 · 结果：<b>芽庄</b></div></article>`;
}
function renderPolls() {
  const list = polls.filter(p => show === "all" || (show === "closed") === !!p.closed).sort((a, b) => (a.closed - b.closed) || (b.at - a.at));
  const legacy = show === "open" ? "" : legacyCard();
  if (!list.length) { $("#polls").innerHTML = (show === "closed" ? "" : `<div class="card"><p class="empty">还没有进行中的投票，点上面「＋ 新投票」发起一个。</p></div>`) + legacy; return; }
  $("#polls").innerHTML = list.map(p => {
    const bs = ballots[p.id] || {}, voters = IDS.filter(id => bs[id]), counts = p.options.map((_, i) => voters.filter(id => bs[id].includes(i)));
    const max = Math.max(0, ...counts.map(c => c.length)), mine = bs[me] || [], canVote = ready() && me && !p.closed;
    const missing = IDS.filter(id => !bs[id]);
    return `<article class="card" data-poll="${esc(p.id)}">
      <div><span class="tag ${p.closed ? "closed" : ""}">${p.closed ? "已截止" : "进行中"}</span><span class="meta">${p.multi ? "多选" : "单选"} · ${esc(nm(p.who))} 发起 · ${new Date(p.at).toLocaleDateString("zh-CN", { month: "numeric", day: "numeric" })}</span></div>
      <h2>${esc(p.title)}</h2>
      <div style="display:grid;gap:8px">${p.options.map((o, i) => {
        const c = counts[i], pct = voters.length ? Math.round(c.length * 100 / voters.length) : 0;
        return `<button class="opt ${p.multi ? "multi" : ""} ${mine.includes(i) ? "mine" : ""} ${c.length && c.length === max ? "lead" : ""}" data-opt="${i}" ${canVote ? "" : "disabled"} aria-pressed="${mine.includes(i)}">
          <span class="bar" style="width:${pct}%"></span><span class="mark">${mine.includes(i) ? "✓" : ""}</span>
          <span class="lbl">${esc(o)}<span class="who">${c.map(nm).map(esc).join("、")}</span></span><span class="n">${c.length} 票 · ${pct}%</span></button>`;
      }).join("")}</div>
      <div class="meta">${voters.length}/4 人已投${missing.length ? " · 还没投：" + missing.map(nm).map(esc).join("、") : " · 全员到齐 🎉"}</div>
      ${!me && !p.closed ? `<p class="sub">先在上面选你是谁，才能投票。</p>` : ""}
      ${p.by === uid ? `<div class="row"><button class="btn ghost small" data-close="${p.closed ? 0 : 1}">${p.closed ? "重新开放" : "截止投票"}</button><button class="btn danger small" data-del="1">删除</button></div>` : ""}
    </article>`;
  }).join("") + legacy;
}
$("#polls").addEventListener("click", async e => {
  const card = e.target.closest("[data-poll]"); if (!card) return;
  const p = polls.find(x => x.id === card.dataset.poll); if (!p) return;
  const o = e.target.closest("[data-opt]"), cl = e.target.closest("[data-close]"), del = e.target.closest("[data-del]");
  try {
    if (o) {
      if (!me) return toast("先选你是谁");
      const i = +o.dataset.opt, cur = (ballots[p.id] || {})[me] || [];
      const next = p.multi ? (cur.includes(i) ? cur.filter(x => x !== i) : [...cur, i].sort((a, b) => a - b)) : (cur.length === 1 && cur[0] === i ? [] : [i]);
      const ref = db.doc(`polls/${p.id}/ballots/${me}`);
      if (next.length) await ref.set({ choices: next, by: uid, at: Date.now() }); else await ref.delete();
    } else if (cl) {
      await db.doc("polls/" + p.id).update({ closed: cl.dataset.close === "1" }); toast(cl.dataset.close === "1" ? "已截止" : "已重新开放");
    } else if (del) {
      if (!confirm("删除这个投票？")) return;
      // delete ballots first so no orphaned votes are left behind
      const bs = await db.collection(`polls/${p.id}/ballots`).get();
      await Promise.all(bs.docs.map(d => d.ref.delete()));
      await db.doc("polls/" + p.id).delete(); toast("已删除");
    }
  } catch (err) { toast(err && err.code === "permission-denied" ? "这个投票已截止，不能再改" : "保存失败，请稍后再试"); }
});

renderMe(); renderTabs();

/* ---------- Firebase: background load, anonymous sign-in, live data ---------- */
function loadScript(src) { return new Promise((res, rej) => { const el = document.createElement("script"); el.src = src; el.async = false; el.onload = res; el.onerror = () => rej(new Error(src)); document.head.appendChild(el); }); }
(async function start() {
  const FAIL = "无法连接数据库。如果你在中国大陆，可能需要开启 VPN。";
  let connected = false, subscribed = false;
  const fail = () => { $("#who").textContent = FAIL; };
  const timer = setTimeout(() => { if (!connected) fail(); }, 10000);
  const SDK = "https://www.gstatic.com/firebasejs/10.12.2/";
  try { for (const s of [SDK + "firebase-app-compat.js", SDK + "firebase-auth-compat.js", SDK + "firebase-firestore-compat.js", "firebase-config.js"]) await loadScript(s); }
  catch (e) { clearTimeout(timer); fail(); return; }
  try { firebase.initializeApp(window.FIREBASE_CONFIG); } catch (e) { clearTimeout(timer); fail(); return; }
  firebase.auth().onAuthStateChanged(u => {
    if (!u || subscribed) return;
    subscribed = true; uid = u.uid; db = firebase.firestore();
    db.collection("polls").onSnapshot(s => {
      if (!connected) { connected = true; clearTimeout(timer); $("#who").textContent = "已连接，四个人看到的是同一份投票。"; }
      polls = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(p => Array.isArray(p.options)); renderPolls();
    }, fail);
    db.collectionGroup("ballots").onSnapshot(s => {
      ballots = {}; s.docs.forEach(d => { const pid = d.ref.parent.parent.id; (ballots[pid] = ballots[pid] || {})[d.id] = d.data().choices || []; }); renderPolls();
    }, fail);
    db.collection("votes").onSnapshot(s => { legacyVotes = s.docs.map(d => ({ id: d.id, ...d.data() })); renderPolls(); }, () => {});
    db.collection("people").onSnapshot(s => { legacyPeople = {}; s.docs.forEach(d => { if (d.data().name) legacyPeople[d.id] = d.data().name; }); renderPolls(); }, () => {});
    db.doc("meta/settings").onSnapshot(d => { if (d.exists && d.data().members) { members = { ...members, ...d.data().members }; renderMe(); renderPolls(); } }, () => {});
  });
  firebase.auth().signInAnonymously().catch(() => { clearTimeout(timer); fail(); });
})();
</script>
</body>
</html>
